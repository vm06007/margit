specVersion: 1.0.0
# Receipt indexing only; repository credentials are never written onchain.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: MargitCheckout
    network: arc-testnet
    source:
      address: '0x3adc0cce0f7a5c7b543a09bc3b783f8317c9108b'
      abi: MargitCheckout
      startBlock: 60950495
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Purchase
      abis:
        - name: MargitCheckout
          file: ../contracts/artifacts/MargitCheckout.abi.json
      eventHandlers:
        - event: PurchaseCompleted(indexed bytes32,indexed bytes32,indexed address,address,address,uint256,bytes32)
          handler: handlePurchaseCompleted
      file: ./src/mapping.ts
