type Purchase @entity(immutable: true) {
  id: Bytes!
  purchaseId: Bytes!
  listingId: Bytes!
  buyer: Bytes!
  seller: Bytes!
  token: Bytes!
  amount: BigInt!
  termsHash: Bytes!
  transactionHash: Bytes!
  timestamp: BigInt!
}

type PurchaseFee @entity(immutable: true) {
  id: Bytes!
  purchaseId: Bytes!
  token: Bytes!
  treasury: Bytes!
  feeAmount: BigInt!
  sellerAmount: BigInt!
  transactionHash: Bytes!
  timestamp: BigInt!
}

type DeferredFeePayment @entity(immutable: true) {
  id: Bytes!
  sellerId: Bytes!
  payer: Bytes!
  amount: BigInt!
  transactionHash: Bytes!
  timestamp: BigInt!
}
